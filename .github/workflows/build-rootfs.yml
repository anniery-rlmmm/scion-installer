name: Build iOS 16.5 RootFS (Scion)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Liberar espacio en disco del runner
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /usr/share/swift /opt/hostedtoolcache/CodeQL
          df -h

      - name: Clonar scion-installer
        uses: actions/checkout@v4

      - name: Instalar dependencias base
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git curl python3 clang lld unzip p7zip-full zip rsync dosfstools e2fsprogs
          sudo apt-get install -y build-essential git curl python3 clang lld unzip p7zip-full zip rsync dosfstools e2fsprogs meson llvm uuid-dev

      - name: Descargar IPSW de iOS 16.5 (20F66) para iPhone X
        run: |
          curl -L --fail -o /tmp/iPhone10,3,iPhone10,6_16.5_20F66_Restore.ipsw \
            "https://api.ipsw.me/v4/ipsw/download/iPhone10,6/20F66"
          ls -lh /tmp/iPhone10,3,iPhone10,6_16.5_20F66_Restore.ipsw

      - name: Ejecutar build-installer.sh (sin Sileo)
        run: |
          chmod +x build-installer.sh
          ./build-installer.sh --ipsw /tmp/iPhone10,3,iPhone10,6_16.5_20F66_Restore.ipsw --device starlte --no-sileo

      - name: Recolectar small root e imágenes
        if: always()
        run: |
          mkdir -p artifacts-out
          sudo find scion-build -maxdepth 4 -type f \( -name "*.img" -o -name "*.dmg" -o -name "*root*" \) -exec cp --parents {} artifacts-out/ \; 2>/dev/null || true
          sudo chown -R $USER:$USER artifacts-out
          ls -lhR artifacts-out
          
      - name: Subir resultado y logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scion-ios165-output
          path: |
           out/
           scion-build/logs/
           scion-build/**/*.img
           scion-build/**/*.dmg
          if-no-files-found: warn
